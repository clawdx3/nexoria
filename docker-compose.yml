version: '3.9'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: nexoria_postgres
    environment:
      POSTGRES_USER: nexoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexoria}
      POSTGRES_DB: nexoria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoria -d nexoria"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexoria_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nexoria_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexoria}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexoria123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nexoria_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexoria}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexoria123}
      S3_BUCKET: ${S3_BUCKET:-nexoria-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true &&
      mc anonymous set none local/$$S3_BUCKET
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: change-me
      DB_NAME: nexoria
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key}
      OPENAI_API_KEY: change-me
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-dev-openrouter-key}
      OLLAMA_API_KEY: change-me
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-ollama}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-gpt-oss:120b}
      NEXORIA_RUNNER_TOKEN: ${NEXORIA_RUNNER_TOKEN:-dev-runner-token-change-me}
      NEXORIA_MCP_TOKEN: ${NEXORIA_MCP_TOKEN:-dev-mcp-token-change-me}
      ARTIFACT_STORAGE_DIR: /app/storage/artifacts
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nexoria-artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-nexoria}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-nexoria123}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "3000:3000"
    volumes:
      - artifact_storage:/app/storage/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["node", "apps/api/dist/main"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexoria_web
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_worker
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: change-me
      DB_NAME: nexoria
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key}
      OPENAI_API_KEY: change-me
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-dev-openrouter-key}
      OLLAMA_API_KEY: change-me
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-ollama}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-gpt-oss:120b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "-e", "console.log('Nexoria worker stub idle: BullMQ processors are not wired yet.'); setInterval(() => {}, 2147483647)"]
    # Replace with a real worker entrypoint when BullMQ processors are wired

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_migrate
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: change-me
      DB_NAME: nexoria
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "api", "typeorm", "migration:run"]
    # Replace with actual TypeORM CLI command when migrations exist
    profiles: ["migrate"]

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: nexoria_camofox
    environment:
      CAMOFOX_PORT: 9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key}
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      MAX_SESSIONS: 50
      MAX_TABS_PER_SESSION: 5
      SESSION_TIMEOUT_MS: 1800000
      BROWSER_IDLE_TIMEOUT_MS: 300000
      TAB_INACTIVITY_MS: 300000
      MAX_OLD_SPACE_SIZE: 512
    volumes:
      - camofox_profiles:/home/node/.camofox/profiles
      - camofox_traces:/home/node/.camofox/traces
    networks:
      - nexoria
    # No ports exposed to host — only internal from api/worker containers
    # Add proxy envs here when you have them:
    # PROXY_STRATEGY: backconnect
    # PROXY_BACKCONNECT_HOST: gate.provider.com
    # PROXY_BACKCONNECT_PORT: 7000
    # PROXY_USERNAME: ${PROXY_USERNAME}
    # PROXY_PASSWORD: change-me
    # restart: unless-stopped

  openclaw-volume-init:
    image: alpine:3.19
    container_name: nexoria_openclaw_volume_init
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /workspace /config && chown -R 1000:1000 /workspace /config && chmod -R u=rwX,go=rX /workspace /config"]
    volumes:
      - openclaw_workspace:/workspace
      - openclaw_config:/config

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: nexoria_openclaw_gateway
    depends_on:
      openclaw-volume-init:
        condition: service_completed_successfully
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-dev-openclaw-gateway-token}
      OPENCLAW_GATEWAY_AUTH_TOKEN: ${OPENCLAW_GATEWAY_AUTH_TOKEN:-dev-openclaw-auth-token}
      OPENCLAW_SANDBOX: "1"
      OPENCLAW_HOME: /home/node
      OLLAMA_API_KEY: change-me
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      NEXORIA_API_BASE_URL: ${NEXORIA_API_BASE_URL:-http://api:3000/api/v1}
      NEXORIA_MCP_TOKEN: ${NEXORIA_MCP_TOKEN:-dev-mcp-token-change-me}
    command:
      - sh
      - -lc
      - |
        openclaw onboard --non-interactive --accept-risk --mode local --gateway-auth token --gateway-token "$OPENCLAW_GATEWAY_TOKEN" --gateway-bind lan --gateway-port 18789 --workspace /home/node/.openclaw/workspace --auth-choice skip --skip-daemon --skip-health --skip-ui || true
        openclaw config patch --file /tmp/nexoria-openclaw-config.json
        exec openclaw gateway run --bind lan --port 18789 --auth token --token "$OPENCLAW_GATEWAY_TOKEN" --allow-unconfigured
    expose:
      - "18789"
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  openclaw-runner:
    build:
      context: .
      dockerfile: apps/openclaw-runner/Dockerfile
    container_name: nexoria_openclaw_runner
    environment:
      NODE_ENV: development
      NEXORIA_API_URL: http://api:3000/api/v1
      NEXORIA_RUNNER_TOKEN: ${NEXORIA_RUNNER_TOKEN:-dev-runner-token-change-me}
      NEXORIA_RUNNER_INSTANCE_KEY: ${NEXORIA_RUNNER_INSTANCE_KEY:-local-runner}
      OPENCLAW_GATEWAY_URL: http://openclaw-gateway:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-dev-openclaw-gateway-token}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openclaw}
      OPENCLAW_CONFIG_DIR: /openclaw-config
      OPENCLAW_WORKSPACE_DIR: /openclaw-workspace
      RUNNER_POLL_MS: ${RUNNER_POLL_MS:-2500}
      RUNNER_HEARTBEAT_MS: ${RUNNER_HEARTBEAT_MS:-15000}
    depends_on:
      api:
        condition: service_started
      openclaw-gateway:
        condition: service_healthy
      openclaw-volume-init:
        condition: service_completed_successfully
    volumes:
      - openclaw_config:/openclaw-config
      - openclaw_workspace:/openclaw-workspace

  power-agent-runtime:
    build:
      context: .
      dockerfile: apps/power-agent-runtime/Dockerfile
    container_name: nexoria_power_agent
    environment:
      NODE_ENV: development
      NEXORIA_API_URL: http://api:3000/api/v1
      NEXORIA_RUNNER_TOKEN: ${NEXORIA_RUNNER_TOKEN:-dev-runner-token-change-me}
      NEXORIA_INSTANCE_KEY: ${NEXORIA_INSTANCE_KEY:-local-instance}
      NEXORIA_USER_ID: ${NEXORIA_USER_ID:-dev-user-id}
      NEXORIA_WORKSPACE_ID: ${NEXORIA_WORKSPACE_ID:-dev-workspace-id}
      NEXORIA_AGENT_ID: ${NEXORIA_AGENT_ID:-dev-agent-id}
      NEXORIA_HUB_URL: ws://api:3000/agent-hub/v1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXORIA_DATA_DIR: /var/nexoria/data
      NEXORIA_SKILLS_DIR: /var/nexoria/skills
      NEXORIA_TOOLS_DIR: /var/nexoria/tools
    ports:
      - "8080:8080"
    volumes:
      - power_agent_data:/var/nexoria/data
      - power_agent_skills:/var/nexoria/skills
      - power_agent_tools:/var/nexoria/tools
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  nexoria:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  camofox_profiles:
  camofox_traces:
  openclaw_config:
  openclaw_workspace:
  artifact_storage:
  minio_data:
  power_agent_data:
  power_agent_skills:
  power_agent_tools:
