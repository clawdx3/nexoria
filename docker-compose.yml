version: '3.9'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: nexoria_postgres
    environment:
      POSTGRES_USER: nexoria
      POSTGRES_PASSWORD: nexoria
      POSTGRES_DB: nexoria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoria -d nexoria"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexoria_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: nexoria
      DB_NAME: nexoria
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-ollama}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-gpt-oss:120b}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "apps/api/dist/main"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexoria_web
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_worker
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: nexoria
      DB_NAME: nexoria
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-change-me
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-ollama}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-gpt-oss:120b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "-e", "console.log('Nexoria worker stub idle: BullMQ processors are not wired yet.'); setInterval(() => {}, 2147483647)"]
    # Replace with a real worker entrypoint when BullMQ processors are wired

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_migrate
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: nexoria
      DB_NAME: nexoria
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "api", "typeorm", "migration:run"]
    # Replace with actual TypeORM CLI command when migrations exist
    profiles: ["migrate"]

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: nexoria_camofox
    environment:
      CAMOFOX_PORT: 9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key-change-me}
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      MAX_SESSIONS: 50
      MAX_TABS_PER_SESSION: 5
      SESSION_TIMEOUT_MS: 1800000
      BROWSER_IDLE_TIMEOUT_MS: 300000
      TAB_INACTIVITY_MS: 300000
      MAX_OLD_SPACE_SIZE: 512
    volumes:
      - camofox_profiles:/home/node/.camofox/profiles
      - camofox_traces:/home/node/.camofox/traces
    networks:
      - nexoria
    # No ports exposed to host — only internal from api/worker containers
    # Add proxy envs here when you have them:
    # PROXY_STRATEGY: backconnect
    # PROXY_BACKCONNECT_HOST: gate.provider.com
    # PROXY_BACKCONNECT_PORT: 7000
    # PROXY_USERNAME: ${PROXY_USERNAME}
    # PROXY_PASSWORD: ${PROXY_PASSWORD}
    # restart: unless-stopped

networks:
  nexoria:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  camofox_profiles:
  camofox_traces:
