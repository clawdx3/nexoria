version: '3.9'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: nexoria_postgres
    environment:
      POSTGRES_USER: nexoria
      POSTGRES_PASSWORD: nexoria
      POSTGRES_DB: nexoria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoria -d nexoria"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexoria_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nexoria_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexoria}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexoria-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nexoria_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexoria}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexoria-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-nexoria-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true &&
      mc anonymous set none local/$$S3_BUCKET
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: nexoria
      DB_NAME: nexoria
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-kimi-k2.6:cloud}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-ollama}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-kimi-k2.6:cloud}
      NEXORIA_RUNNER_TOKEN: ${NEXORIA_RUNNER_TOKEN:-dev-runner-token-change-me}
      NEXORIA_PRO_AGENT_TOKEN: ${NEXORIA_PRO_AGENT_TOKEN:-dev-pro-agent-token-change-me}
      NEXORIA_MCP_TOKEN: ${NEXORIA_MCP_TOKEN:-dev-mcp-token-change-me}
      ARTIFACT_STORAGE_DIR: /app/storage/artifacts
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nexoria-artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-nexoria}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-nexoria-minio-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "3000:3000"
    volumes:
      - artifact_storage:/app/storage/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["node", "apps/api/dist/main"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexoria_web
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_worker
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: nexoria
      DB_NAME: nexoria
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-change-me
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-kimi-k2.6:cloud}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-ollama}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-kimi-k2.6:cloud}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "-e", "console.log('Nexoria worker stub idle: BullMQ processors are not wired yet.'); setInterval(() => {}, 2147483647)"]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexoria_migrate
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexoria
      DB_PASSWORD: nexoria
      DB_NAME: nexoria
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "api", "typeorm", "migration:run"]
    profiles: ["migrate"]

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: nexoria_camofox
    environment:
      CAMOFOX_PORT: 9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-dev-camofox-key-change-me}
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      MAX_SESSIONS: 50
      MAX_TABS_PER_SESSION: 5
      SESSION_TIMEOUT_MS: 1800000
      BROWSER_IDLE_TIMEOUT_MS: 300000
      TAB_INACTIVITY_MS: 300000
      MAX_OLD_SPACE_SIZE: 512
    volumes:
      - camofox_profiles:/home/node/.camofox/profiles
      - camofox_traces:/home/node/.camofox/traces

  pro-agent:
    build:
      context: .
      dockerfile: apps/pro-agent/Dockerfile
    container_name: nexoria_pro_agent
    environment:
      NODE_ENV: development
      NEXORIA_API_URL: http://api:3000/api/v1
      NEXORIA_AGENT_TOKEN: ${NEXORIA_PRO_AGENT_TOKEN:-dev-pro-agent-token-change-me}
      NEXORIA_WORKSPACE_ID: ${NEXORIA_PRO_AGENT_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      LLM_PROVIDER: ${PRO_AGENT_LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${PRO_AGENT_LLM_API_KEY:-${OLLAMA_API_KEY}}
      LLM_MODEL: ${PRO_AGENT_LLM_MODEL:-${OLLAMA_MODEL:-kimi-k2.6:cloud}}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - pro_agent_data:/app/data
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  hermes-plugin-init:
    image: nousresearch/hermes-agent:latest
    container_name: nexoria_hermes_plugin_init
    profiles: ["hermes"]
    command:
      - sh
      - -lc
      - >
        /opt/hermes/.venv/bin/hermes plugins enable nexoria &&
        python3 -c "from pathlib import Path; import os, re; p = Path('/opt/data/config.yaml'); text = p.read_text() if p.exists() else ''; model = os.environ.get('HERMES_MODEL') or os.environ.get('OLLAMA_MODEL') or 'kimi-k2.6:cloud'; base_url = os.environ.get('OLLAMA_BASE_URL') or 'https://ollama.com/v1'; block = f'model:\n  default: {model}\n  provider: ollama-cloud\n  base_url: {base_url}\n'; text = re.sub(r'^model:\n(?:  .*\n)*', block, text, count=1, flags=re.M) if re.search(r'^model:\n', text, flags=re.M) else block + text; p.write_text(text)"
    environment:
      NEXORIA_API_URL: http://api:3000/api/v1
      NEXORIA_AGENT_TOKEN: ${NEXORIA_PRO_AGENT_TOKEN:-dev-pro-agent-token-change-me}
      NEXORIA_WORKSPACE_ID: ${NEXORIA_HERMES_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      HERMES_MODEL: ${HERMES_MODEL:-kimi-k2.6:cloud}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-kimi-k2.6:cloud}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
    volumes:
      - hermes_data:/opt/data
      - ./apps/hermes-plugin/nexoria:/opt/data/plugins/nexoria:ro
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: nexoria_hermes
    profiles: ["hermes"]
    command: gateway run
    environment:
      NEXORIA_API_URL: http://api:3000/api/v1
      NEXORIA_AGENT_TOKEN: ${NEXORIA_PRO_AGENT_TOKEN:-dev-pro-agent-token-change-me}
      NEXORIA_WORKSPACE_ID: ${NEXORIA_HERMES_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:-dev-hermes-api-key}
      API_SERVER_CORS_ORIGINS: ${HERMES_API_CORS_ORIGINS:-}
      API_SERVER_MODEL_NAME: ${HERMES_MODEL:-${OLLAMA_MODEL:-kimi-k2.6:cloud}}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-kimi-k2.6:cloud}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
    ports:
      - "8642:8642"
    volumes:
      - hermes_data:/opt/data
      - ./apps/hermes-plugin/nexoria:/opt/data/plugins/nexoria:ro
    depends_on:
      hermes-plugin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$API_SERVER_KEY\" http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  hermes-runner:
    build:
      context: .
      dockerfile: apps/hermes-runner/Dockerfile
    container_name: nexoria_hermes_runner
    profiles: ["hermes"]
    environment:
      NODE_ENV: development
      NEXORIA_API_URL: http://api:3000/api/v1
      NEXORIA_WORKSPACE_ID: ${NEXORIA_HERMES_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      NEXORIA_AGENT_PROFILE_ID: ${NEXORIA_HERMES_AGENT_PROFILE_ID:-}
      NEXORIA_MCP_URL: http://api:3000/api/v1/mcp
      NEXORIA_MCP_TOKEN: ${NEXORIA_MCP_TOKEN:-dev-mcp-token-change-me}
      HERMES_API_URL: ${HERMES_API_URL:-http://hermes:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-dev-hermes-api-key}
      HERMES_MODEL: ${HERMES_MODEL:-${OLLAMA_MODEL:-kimi-k2.6:cloud}}
      HERMES_RUN_TIMEOUT_MS: ${HERMES_RUN_TIMEOUT_MS:-300000}
      LOCAL_DIR: /app/data
    volumes:
      - hermes_runner_data:/app/data
    depends_on:
      api:
        condition: service_started
      hermes:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  default:
    name: nexoria

volumes:
  postgres_data:
  redis_data:
  camofox_profiles:
  camofox_traces:
  artifact_storage:
  minio_data:
  pro_agent_data:
  hermes_data:
  hermes_runner_data:
